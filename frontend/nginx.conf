server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router usa rutas del lado del cliente (ej. /repair-orders/5) —
    # sin esto, refrescar la página en una ruta que no sea "/" devolvería
    # un 404 de Nginx en vez de dejar que React Router la resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
